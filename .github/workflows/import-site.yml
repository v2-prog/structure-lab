name: Import Structure Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and clean the live Grok build
        run: |
          set -euo pipefail
          mkdir -p assets
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          curl -fL --retry 3 -A "$UA" -o index.html "https://ever-earth-acre-xenon.grok.me/"
          curl -fL --retry 3 -A "$UA" -o assets/index-8eU5pCGS.js "https://ever-earth-acre-xenon.grok.me/assets/index-8eU5pCGS.js"
          curl -fL --retry 3 -A "$UA" -o assets/routes-CNbpnZBC.js "https://ever-earth-acre-xenon.grok.me/assets/routes-CNbpnZBC.js"
          curl -fL --retry 3 -A "$UA" -o assets/styles-BwZ_0gTw.css "https://ever-earth-acre-xenon.grok.me/assets/styles-BwZ_0gTw.css"
          curl -fL --retry 3 -A "$UA" -o favicon.svg "https://ever-earth-acre-xenon.grok.me/favicon.svg"
          curl -fL --retry 3 -A "$UA" -o og.jpg "https://ever-earth-acre-xenon.grok.me/og.jpg" || true
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          raw = p.read_text(encoding='utf-8', errors='replace')
          raw = re.sub(r'<script src="https://grok.com/grok-app-builder/extensions.js"[^>]*></script>', '', raw)
          raw = re.sub(r'<meta name="grok-project-id"[^>]*>', '', raw)
          raw = re.sub(r'<meta property="grok:app_id"[^>]*>', '', raw)
          raw = raw.replace('/__grok/manifest.webmanifest', './site.webmanifest')
          raw = raw.replace('/__grok/icon-180.png', './favicon.svg')
          raw = raw.replace('https://ever-earth-acre-xenon.grok.me/og.jpg', './og.jpg')
          raw = raw.replace('href="/assets/', 'href="./assets/')
          raw = raw.replace('src="/assets/', 'src="./assets/')
          raw = raw.replace('href="/favicon.svg"', 'href="./favicon.svg"')
          raw = raw.replace('["/assets/', '["./assets/')
          raw = raw.replace('src:"/assets/', 'src:"./assets/')
          p.write_text(raw)
          Path('404.html').write_text(raw)
          js = Path('assets/index-8eU5pCGS.js')
          t = js.read_text(encoding='utf-8', errors='replace')
          t = t.replace('`/assets/styles-BwZ_0gTw.css`', '`./assets/styles-BwZ_0gTw.css`')
          t = t.replace('href:`/__grok/icon-180.png`', 'href:`./favicon.svg`')
          t = t.replace('href:`/__grok/manifest.webmanifest`', 'href:`./site.webmanifest`')
          js.write_text(t)
          Path('.nojekyll').write_text('')
          print('cleaned index', p.stat().st_size)
          PY

      - name: Commit imported site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import Structure Lab AU static site"
            git push
          fi
